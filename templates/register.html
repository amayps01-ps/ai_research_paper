<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Research Paper Recommendation System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #222;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #142d4e;
            font-size: 25px;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #087e8b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066773;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            background: #fff0f0;
            color: #a00000;
            border-radius: 5px;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }

        a {
            color: #087e8b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <p>AI Research Paper Recommendation System</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            autocomplete="name"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            required
        >

        <label for="confirm_password">Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            placeholder="Enter your password again"
            required
        >

        <button type="submit">Register</button>

    </form>

    <div class="links">
        Already have an account?
        <a href="{{ url_for('login') }}">Login here</a>
        <br>
        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>

</div>

</body>
</html>
