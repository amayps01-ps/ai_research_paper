{% extends "base.html" %}

{% block title %}Register | AI Research{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">👨‍🎓</div>

        <h1>Create Account</h1>

        <p class="auth-description">
            Join AI Research and discover useful research papers.
        </p>

        <form method="POST" action="{{ url_for('register') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                maxlength="100"
                autocomplete="name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                maxlength="254"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Enter password again"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="btn btn-primary auth-button">
                Create Account
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </div>

</div>

{% endblock %}
